[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "snps"
dynamic = ["version"]
description = "tools for reading, writing, generating, merging, and remapping SNPs"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [{ name = "Andrew Riha", email = "apriha@gmail.com" }]
keywords = ["snps", "dna", "chromosomes", "bioinformatics", "vcf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = [
    "numpy>=2",
    "pandas>=3.1",
    "atomicwrites",
    "pooch>=1.8",
]

[project.urls]
Homepage = "https://github.com/apriha/snps"
Documentation = "https://snps.readthedocs.io/"
Changelog = "https://github.com/apriha/snps/releases"
"Issue Tracker" = "https://github.com/apriha/snps/issues"

# Docs dependencies live in docs/requirements.txt (used by Read the Docs and CI), not here.
[dependency-groups]
test = ["pytest", "pytest-cov", "sybil"]
dev = [
    "ruff",
    "pre-commit",
    "mypy",
    "pandas-stubs",
    { include-group = "test" },
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py311"

# https://github.com/astral-sh/ruff/issues/465#issuecomment-1783684428
[tool.ruff.lint]
extend-select = ["I"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
strict = true
warn_unreachable = true

# Modules not yet type-checked.
[[tool.mypy.overrides]]
module = [
    "snps.io.reader",
    "snps.io.writer",
    "snps.resources",
    "snps.snps",
    "snps.testing",
    "snps.utils",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = "atomicwrites.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = "-ra --strict-markers --tb=short -p no:doctest"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
